<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <rect x="0" y="0" width="1123" height="794" fill="#ffffff"/>

  <!-- ============ TITLE ============ -->
  <text x="561" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#000">Hostel Maintenance &amp; Issue Ticketing System</text>
  <text x="561" y="70" text-anchor="middle" font-size="15" fill="#000">UML Component Diagram — Layered Architecture</text>

  <!-- ============ LAYER BANDS ============ -->
  <rect x="40" y="100" width="1043" height="128" rx="6" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="7,5"/>
  <text x="54" y="168" font-size="12.5" font-weight="bold" fill="#555" letter-spacing="1">PRESENTATION LAYER</text>

  <rect x="40" y="238" width="1043" height="254" rx="6" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="7,5"/>
  <text x="54" y="369" font-size="12.5" font-weight="bold" fill="#555" letter-spacing="1">BUSINESS LAYER</text>

  <rect x="40" y="500" width="1043" height="190" rx="6" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="7,5"/>
  <text x="54" y="599" font-size="12.5" font-weight="bold" fill="#555" letter-spacing="1">DATA LAYER</text>

