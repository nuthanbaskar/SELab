  <text x="560" y="620" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Component</text>

  <!-- ============ I1 : UI (socket) -> ISSUE MANAGEMENT (ball) ============ -->
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="360" y1="210" x2="360" y2="232"/>
    <path d="M 346 246 A 14 14 0 0 1 374 246"/>
    <line x1="360" y1="246" x2="360" y2="260"/>
    <circle cx="360" cy="260" r="8" fill="#ffffff"/>
    <line x1="360" y1="268" x2="360" y2="290"/>
  </g>
  <text x="334" y="254" text-anchor="end" font-size="13.5" font-weight="bold" fill="#000">I1: Submit Issue / Validate Details</text>
  <text x="334" y="272" text-anchor="end" font-size="11.5" fill="#333">provided by Issue Management Component</text>

  <!-- ============ I2 : UI (socket) -> TICKET MANAGEMENT (ball) ============ -->
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="760" y1="210" x2="760" y2="232"/>
    <path d="M 746 246 A 14 14 0 0 1 774 246"/>
    <line x1="760" y1="246" x2="760" y2="260"/>
    <circle cx="760" cy="260" r="8" fill="#ffffff"/>
    <line x1="760" y1="268" x2="760" y2="290"/>
  </g>
  <text x="786" y="254" font-size="13.5" font-weight="bold" fill="#000">I2: View Tickets / Update Ticket Status</text>
  <text x="786" y="272" font-size="11.5" fill="#333">provided by Ticket Management Component</text>

  <!-- ============ I3 : ISSUE MANAGEMENT (socket) -> DATABASE (ball) ============ -->
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="360" y1="370" x2="360" y2="392"/>
    <path d="M 346 406 A 14 14 0 0 1 374 406"/>
    <line x1="360" y1="406" x2="360" y2="520"/>
    <circle cx="360" cy="520" r="8" fill="#ffffff"/>
    <line x1="360" y1="528" x2="360" y2="550"/>
  </g>
  <text x="334" y="438" text-anchor="end" font-size="13.5" font-weight="bold" fill="#000">I3: Create / Store Ticket</text>
  <text x="334" y="456" text-anchor="end" font-size="11.5" fill="#333">provided by Database Component</text>

  <!-- ============ I4 : TICKET MANAGEMENT (socket) -> DATABASE (ball) ============ -->
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="760" y1="370" x2="760" y2="392"/>
    <path d="M 746 406 A 14 14 0 0 1 774 406"/>
    <line x1="760" y1="406" x2="760" y2="520"/>
    <circle cx="760" cy="520" r="8" fill="#ffffff"/>
    <line x1="760" y1="528" x2="760" y2="550"/>
  </g>
  <text x="786" y="438" font-size="13.5" font-weight="bold" fill="#000">I4: Retrieve / Update Ticket Data</text>
  <text x="786" y="456" font-size="11.5" fill="#333">provided by Database Component</text>

  <!-- ============ DEPENDENCIES TO AUTHENTICATION (NOT INTERFACES) ============ -->
  <g stroke="#000" stroke-width="1.6" fill="none" stroke-dasharray="7,5">
    <line x1="440" y1="370" x2="440" y2="398"/>
    <line x1="680" y1="370" x2="680" y2="398"/>
  </g>
  <g stroke="#000" stroke-width="1.6" fill="none">
    <polyline points="433,388 440,400 447,388"/>
    <polyline points="673,388 680,400 687,388"/>
  </g>
  <text x="430" y="388" text-anchor="end" font-size="12.5" fill="#000">«use»</text>
  <text x="690" y="388" font-size="12.5" fill="#000">«use»</text>


  <!-- ============ NOTATION KEY ============ -->
  <text x="860" y="566" font-size="12" font-weight="bold" fill="#555">Notation</text>
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="860" y1="590" x2="886" y2="590"/>
    <circle cx="894" cy="590" r="8" fill="#ffffff"/>
    <line x1="860" y1="620" x2="885" y2="620"/>
    <path d="M 898 607 A 13 13 0 0 0 898 633"/>
  </g>
  <text x="912" y="594" font-size="11" fill="#333">provided interface (lollipop)</text>
  <text x="912" y="624" font-size="11" fill="#333">required interface (socket)</text>

</svg>
