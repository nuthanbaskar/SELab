    <rect x="656" y="413" width="9" height="4.5"/>
    <rect x="656" y="420" width="9" height="4.5"/>
  </g>
  <text x="560" y="427" text-anchor="middle" font-size="12" fill="#000">«component»</text>
  <text x="560" y="449" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">Authentication &amp; Authorization</text>
  <text x="560" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">Component</text>

  <!-- ============ COMPONENT 5 : DATABASE ============ -->
  <rect x="300" y="550" width="520" height="80" fill="#ffffff" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1.6" fill="#ffffff">
