  <rect x="300" y="130" width="520" height="80" fill="#ffffff" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1.6" fill="#ffffff">
    <rect x="782" y="142" width="22" height="16"/>
    <rect x="776" y="145" width="9" height="4.5"/>
    <rect x="776" y="152" width="9" height="4.5"/>
  </g>
  <text x="560" y="159" text-anchor="middle" font-size="12" fill="#000">«component»</text>
  <text x="560" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">User Interface</text>
  <text x="560" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Component</text>

  <!-- ============ COMPONENT 2 : ISSUE MANAGEMENT ============ -->
  <rect x="250" y="290" width="220" height="80" fill="#ffffff" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1.6" fill="#ffffff">
    <rect x="432" y="302" width="22" height="16"/>
    <rect x="426" y="305" width="9" height="4.5"/>
    <rect x="426" y="312" width="9" height="4.5"/>
  </g>
  <text x="360" y="319" text-anchor="middle" font-size="12" fill="#000">«component»</text>
  <text x="360" y="342" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Issue Management</text>
  <text x="360" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Component</text>

  <!-- ============ COMPONENT 3 : TICKET MANAGEMENT ============ -->
  <rect x="650" y="290" width="220" height="80" fill="#ffffff" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1.6" fill="#ffffff">
    <rect x="832" y="302" width="22" height="16"/>
    <rect x="826" y="305" width="9" height="4.5"/>
    <rect x="826" y="312" width="9" height="4.5"/>
  </g>
  <text x="760" y="319" text-anchor="middle" font-size="12" fill="#000">«component»</text>
  <text x="760" y="342" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Ticket Management</text>
  <text x="760" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Component</text>

  <!-- ============ COMPONENT 4 : AUTHENTICATION & AUTHORIZATION ============ -->
  <rect x="420" y="400" width="280" height="75" fill="#ffffff" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1.6" fill="#ffffff">
